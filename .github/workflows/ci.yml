name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest
            cc: ""
            cxx: ""

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 24 is where java.lang.classfile arrived, and tests/corpus/VerifyAll.java
      # needs it. On an older JDK the insert_offsets test reports itself skipped
      # rather than failing, which is easy to miss, so pin a version that runs it.
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJNI2HOOK_BUILD_TESTS=ON
          -DJNI2HOOK_BUILD_EXAMPLES=ON
          -DJNI2HOOK_INSTALL=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/jni2hook"

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/install -B build-install-test
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/jni2hook

      - name: Build installed-package consumer
        run: cmake --build build-install-test --config Release --parallel
